name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Go 1.27 export data needs a golangci-lint built with Go >= 1.27
  # (v2.11.x built with 1.26 panics). Bump deliberately.
  GOLANGCI_LINT_VERSION: v2.14.0
  IMAGE: ghcr.io/kc9wwh/symbiont

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Uses the go.mod toolchain directive (the Dockerfile's Go version).
          go-version-file: go.mod
          # No module/build cache: this workflow also publishes on v* tags,
          # and a cache written by a PR run must not feed a release build.
          cache: false

      - name: go mod tidy check
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: go test -race
        run: go test -race -count=1 ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Not gofmt'ed:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          skip-cache: true

  image:
    needs: [test, lint]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload Grype results to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Single-platform build loaded into the local daemon so it can be
      # scanned. Tag builds start clean (no shared layer cache), so a cache
      # entry written by a PR run cannot reach what gets scanned or released.
      - name: Build (amd64, for scanning)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          provenance: false
          tags: symbiont:scan
          no-cache: ${{ startsWith(github.ref, 'refs/tags/v') }}
          cache-from: ${{ !startsWith(github.ref, 'refs/tags/v') && 'type=gha' || '' }}
          cache-to: ${{ !startsWith(github.ref, 'refs/tags/v') && 'type=gha,mode=max' || '' }}

      # Fails on any HIGH or CRITICAL finding that has a fix available
      # (Go standard library, Go modules, and base-image packages). Findings
      # with no fix yet are not reported: there is nothing to act on.
      - name: Grype scan
        id: scan
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: symbiont:scan
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          output-format: sarif

      # Skipped on fork and Dependabot PRs: their tokens are read-only, so the
      # upload would fail the job. The scan above still gates the merge.
      - name: Upload Grype results to code scanning
        if: ${{ !cancelled() && steps.scan.outputs.sarif != '' && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')) }}
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
          category: grype

      # Readable findings in the job summary (the SARIF alone is only in the
      # Security tab).
      - name: Summarize Grype findings
        if: ${{ !cancelled() && steps.scan.outputs.sarif != '' }}
        env:
          SARIF: ${{ steps.scan.outputs.sarif }}
        run: |
          {
            echo "### Grype (HIGH or CRITICAL with a fix available)"
            n="$(jq '[.runs[].results[]] | length' "$SARIF")"
            if [ "$n" -eq 0 ]; then
              echo "No findings."
            else
              jq -r '.runs[].results[] | "- " + .ruleId + ": " + (.message.text | split(" was found in")[0])' "$SARIF"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Proves the arm64 variant builds too. Tag builds skip this: the
      # publish job builds both platforms.
      - name: Build (multi-arch, not pushed)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha

  # Publishes to GHCR on v* tags only, after every other job has passed.
  # Write and attestation permissions live here, never on PR runs.
  publish:
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs: [test, lint, image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push the image to GHCR
      id-token: write # keyless signing of the build provenance (Sigstore)
      attestations: write # store the provenance attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=sha,format=short

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Release builds start clean: no layer cache in or out. BuildKit
      # attaches an SBOM and max-detail provenance to the image index. The
      # SBOM generator image is pinned by digest (it is pulled at build time);
      # Dependabot cannot see it here, so bump it deliberately.
      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          no-cache: true
          provenance: mode=max
          attests: type=sbom,generator=docker/buildkit-syft-scanner@sha256:ae4f3b554449e7e25548e7d8ccc029d17357348e30c6e3df01b92bc93654d6a9

      # GitHub-signed SLSA provenance for the pushed image digest, stored with
      # the image in GHCR. Verify with: gh attestation verify (see README).
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          # Storage records need an organization-owned repository.
          create-storage-record: false
