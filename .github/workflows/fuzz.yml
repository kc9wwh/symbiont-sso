name: fuzz

# Nightly fuzzing of the parsers that handle untrusted input. Ordinary CI
# already runs every fuzz target's seed corpus as a regular test; this job
# searches for new failing inputs. A failure uploads the minimised input as
# an artifact; copy it into the package's testdata/fuzz/<Target>/ directory
# to turn it into a permanent regression test.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      fuzztime:
        description: "Time per fuzz target (Go duration, e.g. 30s, 5m)"
        required: false
        default: "3m"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        package: [idp, session, clientip, config, oidcrp]
    env:
      PACKAGE: ./internal/${{ matrix.package }}
      FUZZTIME: ${{ inputs.fuzztime || '3m' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      # One `go test -fuzz` run per target (Go fuzzes a single target at a
      # time). Targets are discovered, so adding a Fuzz function needs no
      # workflow change. All targets run even if an earlier one fails.
      - name: Fuzz
        run: |
          status=0
          targets="$(go test "$PACKAGE" -list '^Fuzz' | grep '^Fuzz' || true)"
          if [ -z "$targets" ]; then
            echo "::error::no fuzz targets found in $PACKAGE"
            exit 1
          fi
          for target in $targets; do
            echo "::group::$PACKAGE $target ($FUZZTIME)"
            if ! go test "$PACKAGE" -run '^$' -fuzz "^${target}\$" -fuzztime "$FUZZTIME"; then
              status=1
            fi
            echo "::endgroup::"
          done
          exit "$status"

      - name: Upload failing inputs
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-failures-${{ matrix.package }}
          path: internal/${{ matrix.package }}/testdata/fuzz/
          if-no-files-found: warn
          retention-days: 30
