name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Daily: new advisories appear without any commit to this repo.
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Bump deliberately (Dependabot does not see versions in env vars).
  GOVULNCHECK_VERSION: v1.8.0
  ACTIONLINT_VERSION: v1.7.12
  ZIZMOR_VERSION: 1.30.1

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Same toolchain as the Dockerfile, so standard-library findings
          # match what ships.
          go-version-file: go.mod
          cache: false

      # Fails on any vulnerability reachable from this module's code.
      - name: govulncheck
        run: go run "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}" ./...

  workflow-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload zizmor SARIF to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: actionlint
        run: go run "github.com/rhysd/actionlint/cmd/actionlint@${ACTIONLINT_VERSION}"

      # Results go to the Security tab (code scanning). The action exits 0 in
      # SARIF mode, so the step below fails the job on any finding. Skipped
      # on fork and Dependabot PRs: their tokens are read-only, so the upload
      # would fail the job (the gate below still runs).
      - name: zizmor (SARIF upload)
        if: ${{ github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') }}
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: ${{ env.ZIZMOR_VERSION }}

      - name: zizmor (fail on findings)
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: ${{ env.ZIZMOR_VERSION }}
          advanced-security: false
