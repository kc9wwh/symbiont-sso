# OSV-Scanner suppressions (also honoured by the OpenSSF Scorecard
# Vulnerabilities check). Every entry needs a reason; see SECURITY.md.

[[IgnoredVulns]]
id = "GO-2026-5932"
# No ignoreUntil: the advisory has no fixed version, and `make no-openpgp`
# (run in CI by security.yml) fails if the affected package is ever imported.
reason = """\
Affects only golang.org/x/crypto/openpgp/... and lists no fixed version, so \
every x/crypto release is flagged. symbiont never imports openpgp: x/crypto \
is required only for ripemd160 (crewjam/saml/xmlenc) and, in tests, pbkdf2 \
(go-jose/v3 via mockoidc). govulncheck reports no reachable code.\
"""

# github.com/go-jose/go-jose/v4 is upgraded to >= v4.1.7 (fixing all three
# advisories below), and govulncheck + Grype continue to gate the built binary.
# OpenSSF Scorecard still flags go.mod because github.com/go-jose/go-jose/v3
# (<= v3.0.5, end-of-life with no fixed v3 release) is pulled in indirectly by
# github.com/oauth2-proxy/mockoidc via the test-only internal/oidcrp/oidctest
# helper. `make no-go-jose-v3` (run in CI by security.yml) fails if go-jose/v3
# is ever imported outside oidctest.

[[IgnoredVulns]]
id = "GHSA-mgcc-cww5-fp2q"
reason = """\
